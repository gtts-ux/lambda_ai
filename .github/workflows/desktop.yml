name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a desktop release after all native checks pass
        type: boolean
        default: false
      version:
        description: Desktop version in package.json
        default: '1.2.1'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
            command: npm run build:mac
          - os: macos-15
            platform: macos
            arch: arm64
            command: npm run build:mac
          - os: windows-latest
            platform: windows
            arch: x64
            command: npm run build:win
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            command: xvfb-run -a npm run build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 libgbm1 libfuse2
      - name: Install build tools
        run: |
          python -m venv .build-venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            .build-venv/Scripts/python -m pip install -r requirements-build.txt
          else
            .build-venv/bin/python -m pip install -r requirements-build.txt
          fi
          npm ci
          node node_modules/electron/install.js
      - name: Test bridge and terminal engine
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PY=.build-venv/Scripts/python; else PY=.build-venv/bin/python; fi
          "$PY" -m unittest discover -s tests -p 'test_*.py' -v
          PYTHONPATH=.. "$PY" -m unittest discover -s ../tests -v
          npm run test:updates
      - name: Fetch the explicitly selected Orion test model
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PY=.build-venv/Scripts/python; else PY=.build-venv/bin/python; fi
          "$PY" ../tools/fetch_orion_test.py test-artifacts/orion-image-1.npz
          echo "LAMBDA_ORION_MODEL=$PWD/test-artifacts/orion-image-1.npz" >> "$GITHUB_ENV"
      - name: Package native desktop app
        run: ${{ matrix.command }}
      - name: Verify macOS distributed ZIP signatures
        if: runner.os == 'macOS'
        run: npm run test:macos-signature
      - name: Test packaged desktop app
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ "${{ matrix.arch }}" == arm64 ]]; then APP=release/mac-arm64/Lambda.app/Contents/MacOS/Lambda; else APP=release/mac/Lambda.app/Contents/MacOS/Lambda; fi
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/$APP"
            npm run test:desktop
          elif [[ "$RUNNER_OS" == Windows ]]; then
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/release/win-unpacked/Lambda.exe"
            npm run test:desktop
          else
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/release/linux-unpacked/lambda-desktop"
            xvfb-run -a npm run test:desktop
          fi
      - name: Test native update and restart
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PY=.build-venv/Scripts/python; else PY=.build-venv/bin/python; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ "${{ matrix.arch }}" == arm64 ]]; then APP=release/mac-arm64/Lambda.app/Contents/MacOS/Lambda; else APP=release/mac/Lambda.app/Contents/MacOS/Lambda; fi
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/$APP"
            "$PY" tests/native_update.py
          elif [[ "$RUNNER_OS" == Windows ]]; then
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/release/win-unpacked/Lambda.exe"
            "$PY" tests/native_update.py
          else
            export LAMBDA_PACKAGED_EXECUTABLE="$PWD/release/linux-unpacked/lambda-desktop"
            xvfb-run -a "$PY" tests/native_update.py
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/Lambda-*.zip
            desktop/release/Lambda-*.exe
            desktop/release/Lambda-*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-test-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/test-artifacts/
          if-no-files-found: ignore

  release:
    name: Publish Desktop app
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-package-*
          path: desktop-artifacts
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', inputs.version) }}
        run: |
          test "$RELEASE_TAG" = "desktop-v$(node -p "require('./desktop/package.json').version")"
          mkdir desktop-packages
          find desktop-artifacts -maxdepth 1 -type f \( -name 'Lambda-*.zip' -o -name 'Lambda-*.exe' -o -name 'Lambda-*.AppImage' \) -exec cp {} desktop-packages/ \;
          test "$(find desktop-packages -type f | wc -l)" -eq 4
          cd desktop-packages
          sha256sum Lambda-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Desktop app ${RELEASE_TAG#desktop-v}" --notes-file ../desktop/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" Lambda-* SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
